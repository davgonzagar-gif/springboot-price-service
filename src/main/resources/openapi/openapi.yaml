openapi: 3.0.3

info:
  title: Price Service API
  version: 1.0.0
  description: |
    REST API for retrieving the applicable product price based on
    application date, product and brand.

servers:
  - url: http://localhost:8080
    description: Local environment

tags:
  - name: Prices
    description: Product pricing operations

paths:
  /api/v1/prices:
    get:
      tags:
        - Prices

      operationId: findApplicablePrice

      summary: Find applicable product price

      description: >
        Returns the applicable price for a product and brand at a given
        application date. If multiple prices are applicable, the one with
        the highest priority is returned.

      parameters:
        - $ref: "#/components/parameters/ApplicationDate"
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/BrandId"

      responses:
        "200":
          description: Applicable price found.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicablePrice"

        "400":
          $ref: "#/components/responses/BadRequest"

        "404":
          $ref: "#/components/responses/NotFound"

        "500":
          $ref: "#/components/responses/InternalServerError"

components:

  schemas:

    ApplicablePrice:
      type: object

      required:
        - productId
        - brandId
        - priceList
        - startDate
        - endDate
        - price
        - currency

      properties:

        productId:
          type: integer
          format: int64
          description: Product identifier.
          example: 35455

        brandId:
          type: integer
          format: int64
          description: Brand identifier.
          example: 1

        priceList:
          type: integer
          format: int32
          description: Price list identifier.
          example: 2

        startDate:
          type: string
          format: date-time
          description: Price validity start date.
          example: "2020-06-14T15:00:00"

        endDate:
          type: string
          format: date-time
          description: Price validity end date.
          example: "2020-06-14T18:30:00"

        price:
          type: number
          format: double
          description: Final applicable price.
          example: 25.45

        currency:
          type: string
          description: ISO 4217 currency code.
          example: EUR

      example:
        productId: 35455
        brandId: 1
        priceList: 2
        startDate: "2020-06-14T15:00:00"
        endDate: "2020-06-14T18:30:00"
        price: 25.45
        currency: EUR

    ErrorResponse:
      type: object

      required:
        - timestamp
        - status
        - error
        - message
        - path

      properties:

        timestamp:
          type: string
          format: date-time

        status:
          type: integer

        error:
          type: string

        message:
          type: string

        path:
          type: string

      example:
        timestamp: "2026-06-23T12:00:00"
        status: 404
        error: "Not Found"
        message: "Applicable price not found"
        path: "/api/v1/prices"

  parameters:

    ApplicationDate:
      name: applicationDate
      in: query
      required: true
      description: Date and time when the price should be applied.

      schema:
        type: string
        format: date-time
        example: "2020-06-14T16:00:00"

    ProductId:
      name: productId
      in: query
      required: true
      description: Product identifier.

      schema:
        type: integer
        format: int64
        minimum: 1
        example: 35455

    BrandId:
      name: brandId
      in: query
      required: true
      description: Brand identifier.

      schema:
        type: integer
        format: int64
        minimum: 1
        example: 1

  responses:

    BadRequest:
      description: Invalid request parameters.

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Applicable price not found.

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalServerError:
      description: Unexpected server error.

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"